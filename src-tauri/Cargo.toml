[package]
name = "sahara-dashboard"
version = "0.1.0"
description = "Sahara Discord Bot Dashboard"
authors = ["Andre Hoey"]
edition = "2021"

[lib]
name = "sahara_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"